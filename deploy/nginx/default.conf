        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /health/ready {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /assets/app.js {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /assets/app.css {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location ^~ /assets/service-logos/ {
        try_files $uri @service_logo_not_found;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    location @service_logo_not_found {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }
}

server {
    listen 8080;
    server_name status.sslping.io;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /health/live {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /health/ready {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # These stable entry files are referenced by API-rendered public status
    # HTML. Revalidate them on each navigation so independent dashboard and
    # backend rollouts never pin an old entry for a year.
    location = /assets/app.js {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /assets/app.css {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Service logos are published with the dashboard build but addressed by
    # stable catalog ids. Do not send the status-page HTML fallback for a
    # missing logo: the client replaces a real 404 with its built-in mark.
    location ^~ /assets/service-logos/ {
        try_files $uri @service_logo_not_found;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    location @service_logo_not_found {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The SPA fallback is internal so status.sslping.io cannot expose dashboard
    # routes by requesting /index.html directly.
    location = /index.html {
        internal;
        try_files /index.html =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/status/([a-z0-9-]+)/?$ {
        return 308 https://status.sslping.io/$1;
    }

    location = /robots.txt {
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=300" always;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://status.sslping.io/sitemap.xml\n";
    }

    location = /sitemap.xml {
        proxy_pass http://sslping-api/v1/public/status-pages-sitemap.xml;
        proxy_set_header Host api.sslping.io;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
    }

    location ~ ^/([a-z0-9-]+)/og\.png$ {
        rewrite ^/([a-z0-9-]+)/og\.png$ /v1/public/status-pages/$1/og.png break;
        proxy_pass http://sslping-api;
        proxy_set_header Host api.sslping.io;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location ~ ^/([a-z0-9-]+)/?$ {
        rewrite ^/([a-z0-9-]+)/?$ /v1/public/status-pages/$1/html break;
        proxy_pass http://sslping-api;
        proxy_set_header Host api.sslping.io;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
