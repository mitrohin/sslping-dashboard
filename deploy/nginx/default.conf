server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    location = /health/live {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /health/ready {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 404;
    }
}

server {
    listen 8080;
    server_name dashboard.sslping.io;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /health/live {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /health/ready {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }
}

server {
    listen 8080;
    server_name status.sslping.io;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /health/live {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /health/ready {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The SPA fallback is internal so status.sslping.io cannot expose dashboard
    # routes by requesting /index.html directly.
    location = /index.html {
        internal;
        try_files /index.html =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /status/ {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
