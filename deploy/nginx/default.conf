server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /health/live {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /health/ready {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /assets/app.js {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /assets/app.css {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Catalog logos use stable service ids. Missing ids must stay real 404s so
    # the public page can switch to its built-in mark instead of receiving the
    # SPA shell. Paths are stable service ids, so revalidate daily when a
    # service updates its identity instead of caching the old mark forever.
    location ^~ /assets/service-logos/ {
        try_files $uri @service_logo_not_found;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    location @service_logo_not_found {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        internal;
        try_files /index.html =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        try_files /index.html =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 404;
    }
}

server {
