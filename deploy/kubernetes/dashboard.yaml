apiVersion: v1
kind: Namespace
metadata:
  name: sslping
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sslping-dashboard
  namespace: sslping
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sslping-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sslping-dashboard
        app.kubernetes.io/part-of: sslping
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sslping-dashboard
      containers:
        - name: dashboard
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sslping-dashboard
  namespace: sslping
spec:
  selector:
    app.kubernetes.io/name: sslping-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sslping-dashboard
  namespace: sslping
spec:
  parentRefs:
    - name: sslping-public
      sectionName: dashboard
  hostnames: [dashboard.sslping.io]
  rules:
    - backendRefs:
        - name: sslping-dashboard
          port: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sslping-dashboard
  namespace: sslping
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sslping-dashboard
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sslping-dashboard-ingress
  namespace: sslping
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sslping-dashboard
  ingress:
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sslping-status
  namespace: sslping
spec:
  parentRefs:
    - name: sslping-public
      sectionName: status
  hostnames: [status.sslping.io]
  rules:
    - backendRefs:
        - name: sslping-dashboard
          port: 80
