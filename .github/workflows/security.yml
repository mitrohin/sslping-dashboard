name: Security maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-maintenance
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - name: Verify release evidence selector
        run: npm run test:security
      - name: Check application and build dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

  # No needs: dependency findings must not hide runtime-image findings.
  runtime-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan the freshly built runtime image
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/security-scan"
          docker build --pull --platform linux/amd64 --build-arg VITE_API_URL=https://api.sslping.io --build-arg VITE_DEMO_MODE=false --build-arg VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA --tag sslping-dashboard:security .
          docker save sslping-dashboard:security --output "${RUNNER_TEMP}/security-scan/image.tar"
          docker run --rm --volume "${RUNNER_TEMP}/security-scan:/scan:ro" aquasec/trivy:0.74.0 image \
            --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1

  deployed-image:
    # Production credentials are never made available to another branch or PR.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      CLUSTER_ID: 42c71c20-f7ee-4e76-b31b-3973adfebcf3
      CLUSTER_NAME: mitrohin-cluster
      REGISTRY_NAME: mitrohin-registry
      IMAGE_NAME: sslping-dashboard
      CONTAINER_NAME: dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
      - name: Isolate temporary access files
        run: |
          printf 'KUBECONFIG=%s/security-kubeconfig\nDOCKER_CONFIG=%s/security-docker\n' "${RUNNER_TEMP}" "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Read and verify the running image
        run: |
          set -euo pipefail
          umask 077
          test "$(doctl kubernetes cluster get "${CLUSTER_ID}" --format ID --no-header | xargs)" = "${CLUSTER_ID}"
          test "$(doctl kubernetes cluster get "${CLUSTER_ID}" --format Name --no-header | xargs)" = "${CLUSTER_NAME}"
          test "$(doctl registry get --format Name --no-header | xargs)" = "${REGISTRY_NAME}"
          doctl kubernetes cluster kubeconfig save "${CLUSTER_ID}" --expiry-seconds 1200
          test "$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" = "https://${CLUSTER_ID}.k8s.ondigitalocean.com"
          kubectl config rename-context "$(kubectl config current-context)" security-readonly >/dev/null
          kubectl --context security-readonly --request-timeout=30s -n sslping get deployment "${IMAGE_NAME}" -o json > "${RUNNER_TEMP}/security-deployment.json"
          kubectl --context security-readonly --request-timeout=30s -n sslping get pods -l "app.kubernetes.io/name=${IMAGE_NAME}" -o json > "${RUNNER_TEMP}/security-pods.json"
          deployed_image="$(node deploy/select-deployed-image.mjs \
            "${RUNNER_TEMP}/security-deployment.json" "${RUNNER_TEMP}/security-pods.json" \
            "${IMAGE_NAME}" "${CONTAINER_NAME}" "registry.digitalocean.com/${REGISTRY_NAME}/${IMAGE_NAME}")"
          printf 'DEPLOYED_IMAGE=%s\n' "${deployed_image}" >> "${GITHUB_ENV}"
          printf '### Deployed image selected for security scan\n\nObserved (UTC): %s\n\n`%s`\n' "$(date -u +%FT%TZ)" "${deployed_image}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Pull and scan the verified deployed digest
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${DOCKER_CONFIG}" "${RUNNER_TEMP}/security-scan"
          doctl registry login --read-only --expiry-seconds 1200
          docker pull --platform linux/amd64 "${DEPLOYED_IMAGE}"
          docker save "${DEPLOYED_IMAGE}" --output "${RUNNER_TEMP}/security-scan/image.tar"
          # Only the image archive is mounted: no kubeconfig or registry credentials.
          docker run --rm --volume "${RUNNER_TEMP}/security-scan:/scan:ro" aquasec/trivy:0.74.0 image \
            --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
      - name: Remove temporary access files
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/security-kubeconfig" "${RUNNER_TEMP}/security-deployment.json" "${RUNNER_TEMP}/security-pods.json"
          rm -rf "${RUNNER_TEMP}/security-docker" "${RUNNER_TEMP}/security-scan"
